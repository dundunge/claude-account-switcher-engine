name: Release independent edition

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CASE_LOCAL_SYNC_BUILD: '1'

jobs:
  build:
    if: github.repository == 'dundunge/claude-account-switcher-engine'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Verify version and source
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests/python -q
      - name: Build and verify macOS universal bundle
        shell: bash
        run: |
          set -euo pipefail
          cargo install tauri-cli --version '^2' --locked
          cargo tauri build --bundles app --target universal-apple-darwin --ci
          APP=target/universal-apple-darwin/release/bundle/macos/CASE.app
          codesign --verify --deep --strict "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = 'local.launcher.case'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
          lipo -archs "$APP/Contents/MacOS/CASE"
          mkdir -p stage/local-sync out
          ditto "$APP" stage/CASE.app
          cp -R engine tools docs stage/local-sync/
          cp README.md README.en.md NOTICE.md LICENSE stage/
          ZIP="CASE-$VERSION-mac-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent stage/CASE.app "out/$ZIP"
          (cd out && shasum -a 256 "$ZIP" > "$ZIP.sha256" && shasum -a 256 -c "$ZIP.sha256")
          tar -czf "out/CASE-$VERSION-local-sync-source.tar.gz" -C stage local-sync README.md README.en.md NOTICE.md LICENSE
          (cd out && shasum -a 256 "CASE-$VERSION-local-sync-source.tar.gz" > "CASE-$VERSION-local-sync-source.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: independent-dist
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: independent-dist
          path: dist
      - name: Publish to our repository
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file docs/RELEASE-NOTES.md

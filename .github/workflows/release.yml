name: Release CASE

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'dundunge/claude-account-switcher-engine'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-2022
            platform: win
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Windows test dependencies
        if: runner.os == 'Windows'
        run: python -m pip install -r tools/requirements-windows.txt
      - name: Verify tag and offline tests
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,tomllib; v=tomllib.load(open("Cargo.toml","rb"))["package"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v'
          python tools/ci_tests.py
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2
      - name: Build macOS universal app
        if: runner.os == 'macOS'
        run: tauri build --bundles app --target universal-apple-darwin --ci
      - name: Verify macOS bundle
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict target/universal-apple-darwin/release/bundle/macos/CASE.app
          lipo -archs target/universal-apple-darwin/release/bundle/macos/CASE.app/Contents/MacOS/CASE
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: tauri build --bundles nsis --ci
      - name: Build Linux packages
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: tauri build --bundles deb,appimage --ci
      - name: Assemble release assets and checksums
        run: python tools/package_release.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: case-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: case-*
          path: dist
          merge-multiple: true
      - name: Verify every required package and checksum
        run: python tools/package_release.py verify
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "CASE $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE-NOTES.md

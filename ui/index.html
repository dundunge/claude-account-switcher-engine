<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- The Content-Security-Policy is set in tauri.conf.json, which adds what
       Tauri's own IPC needs to it. -->
  <title>CASE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <!-- "deep": the whole row drags the window, except its buttons. -->
    <header class="titlebar" data-tauri-drag-region="deep">
      <div id="lead"></div>
      <span class="grow"></span>
      <div id="tools"></div>
    </header>
    <main id="view" class="view"></main>
  </div>

  <script src="api.js"></script>
  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script src="quota.js"></script>
  <script src="launcher.js"></script>
</body>
</html>
